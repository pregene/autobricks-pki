[package]
name = "autobricks-pki"
version = "1.0.0"
edition = "2024"
publish = false
license-file = "LICENSE"
build = "scripts/build/version.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "abpkid"
path = "src/server/main.rs"

[[bin]]
name = "abpki-cli"
path = "src/client/main.rs"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
rusqlite = { version = "0.38", features = ["bundled"] }
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tar = "0.4"
flate2 = "1"
tempfile = "3"


[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
