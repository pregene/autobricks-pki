[package]
name = "autobricks-pki"
version = "1.0.0"
edition = "2024"
publish = false
license-file = "LICENSE"

[lib]
path = "src/lib.rs"

[[bin]]
name = "abpkid"
path = "src/server/main.rs"
required-features = ["server"]

[[bin]]
name = "abpki-cli"
path = "src/client/main.rs"

[[test]]
name = "domain"
path = "src/test/domain.rs"

[[test]]
name = "lifecycle"
path = "src/test/lifecycle.rs"

[[test]]
name = "listing"
path = "src/test/listing.rs"

[[test]]
name = "management"
path = "src/test/management.rs"

[[test]]
name = "panic_gate"
path = "src/test/panic_gate.rs"

[[test]]
name = "policies"
path = "src/test/policies.rs"

[[test]]
name = "truelog"
path = "src/test/truelog.rs"

[[test]]
name = "worm"
path = "src/test/worm.rs"

[features]
default = ["server"]
server = ["dep:openssl", "dep:rusqlite", "dep:tar", "dep:flate2", "dep:tempfile", "dep:libloading"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
openssl = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
autobricks-certificate = { path = "../autobricks-certificate" }
libloading = { version = "0.8", optional = true }


[lints.rust]
unsafe_code = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
rustls-native-certs = "0.8"
